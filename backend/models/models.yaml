# Sovereign Workbench — model registry
# Adding a new model = 6 lines here. No code changes.
# PS requirement: "New open weight models should be addable later
#                  without redesigning the system."

active_profile: tier-S

# ---------------------------------------------------------------------------
# MEASURED ON THIS MACHINE (MacBook Air M1, 8 GB)
#   qwen3.5:0.8b  think=default -> 40.8s / 1450 out tokens
#   qwen3.5:0.8b  think=false   ->  0.53s /   12 out tokens   <- 77x faster
#   throughput 36 tok/s (Metal is fine - the problem was thinking tokens, not speed)
# RULE: think=false is the DEFAULT. Turn it on only for planning/final reasoning.
#
#   qwen3.5:2b  reason lane, same question, MacBook Air M1 8 GB:
#     think=false          ->  31.4s /  501 tok / full 1908-char answer
#     think=true  cap 2048 ->  96.2s / 2048 tok /    0 char  <- EMPTY ANSWER
#     think=true  cap 4096 -> 117.0s / 2297 tok /  135 char
#   The 2b model needs ~9000 chars of reasoning before it answers. At cap 2048
#   that budget is exhausted and content comes back blank - not an error, an
#   empty string. That is the most dangerous failure in a demo, so the tier-S
#   reason lane runs think=false too. For deep reasoning, ask per call:
#       c.chat("reason", q, think=True, max_tokens=4096)
#   llm.py also detects this as truncation and retries once by itself.
#
#   Hot-swap measured (max_loaded_models=1): router 0.8b -> reason 2b = 47.6s,
#   both 2b (no swap) = 45.5s. A ~2s difference: swapping is cheap, so the
#   0.8b router stays.
# ---------------------------------------------------------------------------

defaults:
  think: false          # <- the single most important line in this project
  temperature: 0
  timeout_s: 120

profiles:

  # ---------------------------------------------------------------------
  # tier-S - the low-end target, and what every number in this repo was
  # measured on: MacBook Air M1, 8 GB, no GPU, no network.
  #
  # 8 GB is the floor the product is designed against, not a compromise we
  # tolerate. max_loaded_models: 1 is what makes it work - models hot-swap
  # instead of coexisting, and the swap was measured at ~2s, which is cheap
  # next to a 20s answer.
  #
  # WHY 4b AND NOT 2b ON THE REASON LANE (measured, 3 grounded questions,
  # full retrieve+generate flow on the same 8 GB machine):
  #   reason 2b : 45.3s total, ~15s per answer, swap +855 MB
  #   reason 4b : 84.0s total, ~28s per answer, swap +462 MB
  # Speed is not the real difference - grounding is. Asked whether a
  # deviation was acceptable, 2b invented a verdict ("exceeds the standard
  # threshold for immediate action") that appears in no passage and
  # contradicts the approval note. 4b said the acceptance criteria were not
  # in the documents, which is correct. A wrong answer costs more than 13
  # seconds, so 4b takes the lane. On 8 GB this pushes into swap - do not
  # run it with a browser full of tabs.
  # ---------------------------------------------------------------------
  tier-S:
    endpoint: http://localhost:11434
    max_loaded_models: 1                    # hot-swap; this is what makes 8 GB work
    keep_alive: 30s
    lanes:
      router:
        model: qwen3.5:0.8b
        think: false
        max_tokens: 32                      # only a JSON classification is needed
      reason:
        model: qwen3.5:4b
        think: false                        # <- changed after measuring, see above
        max_tokens: 1024
      code:
        # Measured, not assumed. Three calculation tasks over the corpus, each
        # generated then actually EXECUTED in the sandbox:
        #   qwen2.5-coder:1.5b  runs 3/3  correct 1/3
        #   qwen3.5:2b          runs 2/3  correct 2/3
        # The coder model writes code that runs and then quietly uses the wrong
        # numbers - on one task it took P-4110A's design pressure of 18.0 barg
        # and used it as a wall thickness. Code that runs with invented inputs
        # is worse than code that fails, because nothing flags it. A general
        # model reads the passages properly, so it takes the lane - and no
        # later profile should quietly reintroduce the coder model.
        model: qwen3.5:4b
        think: false
        max_tokens: 1024
      vision:
        model: qwen3.5:4b                   # natively multimodal - no separate VLM needed
        think: false
        max_tokens: 1024
      embed:
        # nomic-embed-text is 274 MB. Qwen3-Embedding-0.6B (639 MB, MTEB 64.3
        # vs ~62) was tried on this project's own benchmark and scored
        # IDENTICALLY, for 2.3x the memory, so it was reverted. The 8B variant
        # tops the open leaderboard at 70.6 but weighs ~5 GB - with
        # max_loaded_models: 1 it would swap against the reason model on every
        # query, so it lives in tier-L. A model earns its place on THIS corpus,
        # not on a public leaderboard.
        # Changing this model invalidates the index: rebuild before trusting it.
        model: nomic-embed-text
        dim: 768

  # ---------------------------------------------------------------------
  # tier-L - the largest open-weight models that exist, per lane.
  #
  # NOTHING HERE HAS BEEN RUN. tier-S is measured; this is a configuration,
  # and it is written down so that "addable without redesigning the system"
  # is demonstrable rather than claimed - the lane names, the event stream,
  # the prompts and every tool are identical. Only this block changes.
  #
  # Hardware, from published self-hosting figures (Sept 2026):
  #   glm-5.3          ~753B      FP8 ~755 GB -> 8x H200; INT4 ~370-390 GB
  #                               fits 8x H100 or 4x H200
  #   deepseek-v4-pro  1.6T MoE   MIT; 80.6% SWE-bench Verified
  #   kimi-k3          2.8T MoE   largest open weight released; 8x B300+
  #   qwen3-vl:235b    235B-A22B  Apache-2.0 flagship VLM
  # This is a datacentre node, not a workstation. A 24 GB laptop runs the
  # step-down column in the README, not this.
  #
  # WHY THE ROUTER STAYS SMALL. The router emits 32 tokens of JSON to pick a
  # lane. Measured on tier-S, few-shot examples took a 0.8b model from 83% to
  # 100% on a held-out set - the accuracy came from the examples, not the
  # parameters. Putting a trillion-parameter model on a classification that a
  # 2b model already gets right would add latency to every single request for
  # nothing.
  #
  # WHY THIS LIST WILL BE WRONG. Open-weight leadership changed hands three
  # times in 2026. That is the argument for the lane abstraction, not against
  # it: when the next one lands, it is six lines here and no code anywhere.
  # ---------------------------------------------------------------------
  # ---------------------------------------------------------------------
  # tier-R - a rented GPU, reachable over the public internet.
  #
  # Same open weights as tier-L, on hardware nobody here owns. It exists so the
  # capability can be shown without a plant GPU node, and it is NOT sovereign:
  # airgap.py classifies a public address as EXTERNAL, the seal refuses the
  # call, and the header badge turns red and says "data leaves this machine".
  #
  # That is the point rather than a snag. A monitor that never changes colour
  # proves nothing; one that refuses a call on stage proves it is the object
  # doing the blocking. Put the rented endpoint below and switch in the header.
  #
  # A third-party model API (DeepSeek, OpenAI, Anthropic) is deliberately NOT
  # offered here. Renting a GPU to run weights you chose is a hardware
  # decision; posting plant documents to somebody else's model is the exact
  # thing this product exists to make impossible.
  # ---------------------------------------------------------------------
  tier-R:
    # Two ways to fill this in. Either is fine; both are EXTERNAL.
    #
    #   self-hosted vLLM pod   endpoint: https://<pod>-8000.proxy.runpod.net
    #                          api_key_env: (omit - pods need no auth)
    #   hosted open weights    endpoint: https://api.deepinfra.com/v1/openai
    #                          api_key_env: TIER_R_API_KEY
    #
    # Pick a provider that serves OPEN WEIGHTS - the same models tier-L runs on
    # a plant GPU node - rather than a vendor's own closed product. The demo
    # then says "this is the model your node will run, reached over the network
    # today", which is true, instead of "this is somebody else's model", which
    # is the thing this product exists to avoid.
    #
    # api_key_env names the environment variable. The key itself never goes in
    # this file: the file is committed, and a key in git is a key that leaked.
    #   export TIER_R_API_KEY=...
    endpoint: https://REPLACE-ME/v1/openai
    # api_key_env: TIER_R_API_KEY
    max_loaded_models: 4
    keep_alive: 60m
    fallback_profile: tier-S
    lanes:
      # Model names must match what the endpoint serves, exactly.
      router:  { model: Qwen/Qwen3-32B,  think: false, max_tokens: 32 }
      reason:  { model: Qwen/Qwen3-32B,  think: false, max_tokens: 2048 }
      code:    { model: Qwen/Qwen3-32B,  think: false, max_tokens: 2048 }
      vision:  { model: Qwen/Qwen3-32B,  think: false, max_tokens: 2048 }
      # Embeddings stay LOCAL. Changing the embedding model invalidates the
      # index, and re-embedding the corpus through a paid endpoint costs money
      # to gain nothing - the comparison is about reasoning, not retrieval.
      embed:   { model: nomic-embed-text, dim: 768 }

  tier-L:
    endpoint: http://192.168.1.50:8000      # vLLM, OpenAI-compatible
    max_loaded_models: 4                    # all of them can stay resident
    keep_alive: 60m
    fallback_profile: tier-S                # if the node does not answer in 2s, drop to tier-S
    lanes:
      # 32 tokens of JSON. Deliberately the one lane that is NOT maximised.
      router:  { model: qwen3.5:2b,           think: false, max_tokens: 32 }
      # Top open-weight entry on the Artificial Analysis intelligence index
      # (45, Sept 2026), ahead of kimi-k3 on 44. MIT.
      reason:  { model: glm-5.3,              think: true,  max_tokens: 8192 }
      # 80.6% SWE-bench Verified, MIT. The code lane runs in a sandbox with no
      # network, so a stronger coder is bounded by the sandbox, not trusted.
      code:    { model: deepseek-v4-pro,      think: false, max_tokens: 4096 }
      # Apache-2.0 flagship VLM, 256K context. Note it still does not COUNT
      # symbols on a drawing - tools/pid_ocr.py does. See the P&ID section of
      # the README for the measurement behind that split.
      vision:  { model: qwen3-vl:235b-a22b,   think: false, max_tokens: 4096 }
      # Largest in the Qwen3-Embedding family; MTEB ~70.6.
      embed:   { model: qwen3-embedding:8b,   dim: 4096 }

# ---------------------------------------------------------------------------
# ROUTING - the router lane classifies input into these classes
# ---------------------------------------------------------------------------
# The 0.8b router has a natural bias: it used to answer "code" for everything
# (it was the first class listed, and its hint contained the word
# "calculation"). Hence 2-3 examples per class - when adding a new class,
# write examples here too rather than touching code.
#
# MEASURED (held-out queries, worded differently from the YAML examples):
#   without examples       : 83% class accuracy (10/12)
#   with examples          : 100% (12/12)
#   after adding chitchat, 15 queries: 93% LANE accuracy (14/15)
#
# Note: LANE accuracy matters more than CLASS accuracy. document and reason
# both map to the reason lane and both retrieve, so confusion between those
# two changes no observable behaviour. Tune on lanes, not classes.
routing:
  classes:
    - name: document
      lane: reason
      hint: "what a file/report/note says - summarise, extract, check against an SOP"
      examples:
        - "what deviation was found on TK-4102?"
        - "summarise the inspection report"
        - "what does the approval note say"
    - name: pid
      lane: reason                          # the pipeline handles P&ID work, not the model
      pre_tool: analyze_pid                 # <- build the graph first, then the reason lane
      hint: "engineering drawing, P&ID, piping diagram, line or valve trace"
      examples:
        - "trace the path from TK-4102 to the PSV on this P&ID"
        - "which isolation valves are on the piping diagram"
    - name: vision
      lane: vision
      hint: "a photo, a scan, any image that is not a P&ID"
      examples:
        - "what is shown in this photo"
        - "read this scan"
    - name: code
      lane: code
      hint: "ONLY when the user wants a new program/script/function written.
             Comparing, choosing, planning, or asking 'how much is it' is NOT
             code - that is reason."
      examples:
        - "write a python script that computes the corrosion rate"
        - "give me code to calculate remaining life"
        - "I need a function that plots the thickness trend"
    - name: reason
      lane: reason
      hint: "general engineering knowledge, planning, comparison, or any
             question answered from understanding rather than from a specific
             file - no document, tag lookup or image referenced"
      examples:
        - "how should we build the shutdown plan"
        - "compare these two pieces of equipment"
        - "which of the two options is better"
        # General engineering knowledge. Measured: without these, "does a pump
        # need a suction strainer" classified as CODE and came back as a Python
        # script, and "how does a gate valve work" fell to chitchat and got the
        # 0.8b lane. The PS asks for an assistant people use the way they use
        # Claude, not a document search box, so an ordinary engineering
        # question has to reach the reasoning lane.
        - "does a pump need a suction strainer"
        - "how does a gate valve work"
        - "what is cavitation and why does it matter"
        - "explain what a relief valve does"
        - "why do we inspect pressure vessels"
        - "what is the difference between a gate valve and a globe valve"
    - name: chitchat
      lane: router                        # 0.8b is enough; waking the 2b is wasteful
      retrieval: false                    # <- never search the corpus for a greeting
      hint: "greeting, thanks, or asking what you can do. NOT a technical
             question - anything asking how something works is reason."
      examples:
        - "hi"
        - "how are you"
        - "what can you do?"
        - "thanks"
  fallback: reason

# ---------------------------------------------------------------------------
# RETRIEVAL - vector search always returns k results, however poor the match.
# On a 5-chunk corpus "hi" pulled the same 4 passages as a real question, and
# the model obediently summarised them. Hence a score floor.
#
# MEASURED (5 chunks, nomic-embed-text, score = 1/(1+L2)):
#   chitchat / off-topic : hi 0.460  "how are you" 0.437  thanks 0.477
#                          "weather today" 0.451  "capital of France" 0.427
#   real plant questions : TK-4102 deviation 0.546  PSV set pressure 0.578
#                          shell thickness 0.586
#   There is a clean gap between 0.477 and 0.546 -> floor at 0.50.
# Re-measure this when the corpus changes, which is why it lives here and
# not in code.
# ---------------------------------------------------------------------------
retrieval:
  min_score: 0.50
  # 4 was too few for an engineering question, and the failure was silent.
  # "Corrosion rate of V-2405" needs the equipment particulars (t-min), the
  # thickness table (readings), the remarks (governing CML and interval) and
  # the policy (the formula) - four chunks before anything unrelated is even
  # considered. Measured on a real survey report: the readings table ranked
  # 8th, so at k=4 the model was asked to compute a rate with no thicknesses
  # in front of it. It invented them; verify.py caught it; the answer was
  # still wrong. See _complete_document in ingest/pipeline.py, which brings
  # the winning document's remaining sections along regardless of rank.
  k: 8

# ---------------------------------------------------------------------------
# Candidates deliberately NOT taken, with reasons, so nobody re-researches them
# ---------------------------------------------------------------------------
rejected:
  # qwen3.5:4b promoted out of this list - it is now the tier-M profile above.
  qwen3-vl:2b:       "1.9 GB - qwen3.5:2b is already multimodal. Revisit for dense scans if 6 GB+ free."
  qwen3-vl:8b:       "6 GB+ - swap thrash on an 8 GB M1. tier-L only."
  deepseek-ocr:      "6.7 GB. A dedicated OCR VLM would help on hard scans and
                      handwriting, but it cannot fit beside anything else on
                      8 GB. RapidOCR (61 MB ONNX) already handles our scans and
                      qwen3.5 is natively multimodal for the rest. Revisit on
                      tier-L."
  glm-ocr:           "Same size class as deepseek-ocr. Same verdict."
  GOT-OCR2 (580M):   "Small enough, but it is a transformers model not an
                      ollama one - it would add a second serving path for
                      marginal gain over RapidOCR. Revisit if handwriting
                      accuracy becomes the blocker."
  llama3.2:3b:       "Good general model, but weaker tool-calling than Qwen."
